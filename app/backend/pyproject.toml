[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "euraika-compass-backend"
version = "0.1.0"
description = "Personal neutral theological research workbench"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115.6,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pgvector>=0.3.6,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pillow>=11.1,<13",
  "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["compass*"]

[tool.pytest.ini_options]
testpaths = ["tests", "compass/adapters/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["postgres: requires a dedicated TEST_DATABASE_URL PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["compass"]
